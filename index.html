<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link

      <ul>

        <li>

            href="https://www.linkedin.com/in/andre-luiz-de-lima-60877a220"

          >

        <li>
          <a
            href="https://www.instagram.com/andreluizpbbr/"

        </li>

        <li>
          <a href="mailto:andreluizjp2015@gmail.com">Enviar e-mail</a>

      <div id="social-links">
        <a
          href="https://github.com/AndreLuizdeLima"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub de Andre Luiz"

        <a
          href="https://www.instagram.com/andreluizpbbr/"

          target="_blank"

        <a
          href="https://www.linkedin.com/in/andre-luiz-de-lima-60877a220"
          target="_blank"
          rel="noopener noreferrer"

      <footer>

        <a
          href="https://github.com/AndreLuizdeLima"
          target="_blank"
